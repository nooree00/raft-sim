# PROBE BRANCH ONLY (reviewer-approved, P5-05): the GitHub runner's memory ceiling for the WGL search.
# Deleted after the measurement; never merged.
name: ci

on:
  push:
    branches: ['claude/blissful-goodall-358smj-probe']

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    container: mcr.microsoft.com/dotnet/sdk:10.0.401@sha256:35d40304542c8689331f8cab17c65926cdf48fe711e289321d71924b230a7d29
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: memory
        run: |
          grep -E "MemTotal|MemAvailable" /proc/meminfo
          cat /sys/fs/cgroup/memory.max 2>/dev/null || true
          nproc
      - name: build
        run: scripts/ci-build.sh
      - name: probe
        run: |
          for spec in "3044 k3 24000000" "7723 k3 8000000" "7723 k3 16000000" "7723 k3 24000000" "7723 k3 32000000" "7723 k3 40000000"; do
            set -- $spec
            code=0; RAFT_PROBE_SEED=$1 RAFT_PROBE_KEY=$2 RAFT_PROBE_BUDGET=$3 dotnet test --project tests/Raft.Scale.Tests --no-build --filter-method "*ProbeBudget*" > out.txt 2>&1 || code=$?
            grep -h "PROBE" out.txt tests/Raft.Scale.Tests/bin/Debug/net10.0/probe.txt 2>/dev/null | tail -1
            echo "seed $1 budget $3: exit $code"
            grep -iE "out of memory|OutOfMemory|killed" out.txt | head -3 || true
          done
