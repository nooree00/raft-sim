# P7-01 probe branch, never merged: KL-2's curve on the GitHub runner (the reviewer deletes the branch).
name: ci

on:
  push:
    branches: ['claude/blissful-goodall-358smj-probe-kl2']

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    container: mcr.microsoft.com/dotnet/sdk:10.0.401@sha256:35d40304542c8689331f8cab17c65926cdf48fe711e289321d71924b230a7d29
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: build
        run: scripts/ci-build.sh
      - name: memory
        run: free -m
      - name: curve
        run: |
          for b in 8000000 16000000 32000000 40000000; do
            PROBE_OUT="$PWD/probe.txt" PROBE_BUDGET=$b dotnet test --project tests/Raft.Membership.Tests --no-build --filter-class "*ProbeKl2" -- --output Detailed 2>&1 | grep -E "PROBE|failed:|succeeded:|not KL-2" || true
          done
          cat probe.txt
